# Initial Copier configuration for gaboverse/harness.
# Keep questions minimal; stack and deployment decisions belong in discovery.
_min_copier_version: "9.0.0"
_subdirectory: template

project_name:
  type: str
  help: Human-readable project name
  placeholder: Example Service

project_slug:
  type: str
  help: Project/repository slug (kebab-case)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: One-sentence project description
  default: ""

documentation_language:
  type: str
  help: Preferred language for project-authored documentation
  choices:
    English: en
    Spanish: es
  default: en

skills:
  type: str
  multiselect: true
  help: Select the skills to install
  choices:
    "SDD — Spec-driven development": sdd
    "Gitmoji — Git commit conventions": gitmoji
  default: '["sdd"]'


_exclude:
  - |
    {% if 'sdd' not in skills %}
    /.agents/skills/sdd/
    {% endif %}
    {% if 'gitmoji' not in skills %}
    /.agents/skills/gitmoji/
    {% endif %}